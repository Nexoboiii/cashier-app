name: build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # only for the npm cache - the build's actual node comes from
      # frontend-maven-plugin's nodeVersion pin in pom.xml
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test
        run: ./mvnw -B clean verify

      # no branch filter: the Phase 3c e2e job needs this artifact on dev too
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cashier-app-jar
          path: target/*.jar
          retention-days: 14

  # Phase 3c adds an `e2e` job here (needs: build) running cypress-io/github-action@v7
