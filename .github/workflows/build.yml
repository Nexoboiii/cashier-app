name: build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # only for the npm cache - the build's actual node comes from
      # frontend-maven-plugin's nodeVersion pin in pom.xml
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test
        run: ./mvnw -B clean verify

      # no branch filter: the Phase 3c e2e job needs this artifact on dev too
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cashier-app-jar
          path: target/*.jar
          retention-days: 14

  # Phase 3c adds an `e2e` job here (needs: build) running cypress-io/github-action@v7
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: ./mvnw -B clean package

      # everything a stranger needs, nothing they don't
      # everything a stranger needs, nothing they don't
      - name: Assemble the bundle
        run: |
          mkdir -p bundle/config
          cp target/cashier-app-*-SNAPSHOT.jar bundle/cashier-app.jar
          cp start-till.bat stop-till.bat bundle/
          cp RUNBOOK.md config.example.properties catalogue.csv bundle/
          cat > bundle/config/application.properties <<'PROPS'
          # paths are relative to this folder - the bundle is self-contained
          server.port=8080
          spring.datasource.url=jdbc:h2:file:./data/cashier;DB_CLOSE_ON_EXIT=FALSE
          spring.h2.console.enabled=false
          cashier.backup.dir=backups
          cashier.backup.keep=20
          cashier.day.default-float=0
          LOG_DIR=logs
          PROPS
          cd bundle && zip -r ../cashier-app-${{ github.ref_name }}.zip .

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: cashier-app-${{ github.ref_name }}.zip
          body: |
            Needs **Java 21** installed. Unzip, run `start-till.bat`.
            Read `RUNBOOK.md` first. Settings live in `config\application.properties`.