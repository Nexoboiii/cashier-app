# cashier-app - external config template
# Copy to config/application.properties beside the jar. config/ is gitignored.
# --- server ---
server.port=8080
# --- database ---
# forward slashes even on Windows
# a wrong path does NOT error - H2 silently creates a new empty db
# DB_CLOSE_ON_EXIT=FALSE so @PreDestroy backup finds an open db
spring.datasource.url=jdbc:h2:file:C:/Users/nexod/Desktop/comic-con_stuff/till/data/cashier;DB_CLOSE_ON_EXIT=FALSE
# dev only - off in Phase 6
spring.h2.console.enabled=true
# --- backups ---
cashier.backup.dir=C:/Users/nexod/Desktop/comic-con_stuff/till/backups
cashier.backup.keep=20
# --- logging ---
# read by logback-spring.xml
LOG_DIR=C:/Users/nexod/Desktop/comic-con_stuff/till/logs
# --- till ---
# opening float, integer minor units
# TODO Phase 2: rupees or cents? must match products table + CSV importer
cashier.day.default-float=0
