# cashier-app - external config template
#
# Copy to config/application.properties BESIDE THE JAR at runtime.
# config/ is gitignored; this file is the committed shape of it so a fresh
# checkout knows what settings exist.
#
# Spring Boot reads config/application.properties from the jar's working
# directory automatically. Editing it at the venue needs Notepad, not Maven.
# --- server ---
server.port=8080
# --- database ---
# WARNING: if this path is wrong, H2 does not error. It silently creates a NEW
# EMPTY database at whatever path it managed to parse. The app starts, the till
# works, and the products are gone. Check the file actually appears where you
# expect after first run, and check it again in Phase 6 when this path moves
# into external config.
#
# Forward slashes even on Windows. H2 fails on backslashes with an error that
# will not tell you that is the problem.
# DB_CLOSE_ON_EXIT=FALSE hands shutdown control to Spring so the @PreDestroy
# backup still finds an open database.
spring.datasource.url=jdbc:h2:file:C:/Users/nexod/Desktop/comic-con_stuff/data/cashier;DB_CLOSE_ON_EXIT=FALSE
# Dev only. Turn this off in Phase 6, before the event.
spring.h2.console.enabled=true
# --- backups ---
# Forward slashes, same reason.
cashier.backup.dir=C:/Users/nexod/Desktop/comic-con_stuff/backups
cashier.backup.keep=20
# --- logging ---
# Read by logback-spring.xml. Forward slashes, same reason.
LOG_DIR=C:/Users/nexod/Desktop/comic-con_stuff/logs
# --- till ---
# Opening float in integer MINOR UNITS.
# TODO Phase 2: the unit is still undecided - whole rupees or cents. Whatever
# gets chosen has to match the products table and the CSV importer. Do not
# leave this TODO here past Phase 2.
cashier.day.default-float=0
